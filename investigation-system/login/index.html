<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../common/style/common.css" />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="./style/base.css" />

    <script type="module" src="../../common/js/common.js"></script>
    <script type="module" src="./js/controller.js"></script>

    <title>タイトル未定</title>

</head>

<body id="login">
    <div class="loginStage">

        <header class="loginHeader">
            <div class="systemLabel">INVESTIGATION SYSTEM</div>
            <div class="systemVersion">ver.1.2.0</div>
        </header>

        <div class="loginPanel">

            <!-- ヘッダー -->
            <div class="panelHeader">
                <span>STATUS</span>
                <span class="systemStatus">● SYSTEM ONLINE</span>
            </div>

            <!-- ディティール -->
            <div class="loginPanels">

                <!-- ログイン入力 -->
                <div id="login-input" class="loginWrapper">

                    <!-- 接続先 -->
                    <div class="justified">

                        <div class="label">DATA BASE</div>

                        <div class="inputWrapper locked">
                            <input value="CASE-KAZAMICHI" readonly tabindex="-1">
                        </div>

                    </div>

                    <!-- ユーザー -->
                    <div class="justified">

                        <div class="label">USER</div>

                        <div class="inputWrapper locked">
                            <input value="T.Y." readonly tabindex="-1">
                        </div>

                    </div>

                    <!-- パスワード -->
                    <div class="justified">

                        <div class="label">PASSWORD</div>

                        <div class="inputWrapper">
                            <input id="input-password">
                        </div>

                    </div>

                    <button id="button-login">LOGIN</button>

                </div>

                <!-- ログイン中 -->
                <div id="login-message" class="loginWrapper hidden">

                    <p>
                        パスワードが一致しなかったため、<br>
                        読み込み専用モードで起動します。
                    </p>

                    <div class="loadGauge">

                        <div class="loadInfo">
                            <span>NOW LOADING</span>
                            <span class="loadPercent">0%</span>
                        </div>

                        <div class="loadTrack">
                            <div class="loadProgress"></div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</body>

</html>
