<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../common/style/common.css" />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="./style/base.css" />
    <link rel="stylesheet" href="./style/detail.css" />
    <link rel="stylesheet" href="./style/list.css" />

    <script type="module" src="../../common/js/common.js"></script>
    <script type="module" src="./js/controller.js"></script>

    <title>タイトル未定</title>

</head>

<body id="investigation-system">

    <!-- -------------------------------------------------- -->
    <!-- ヘッダー -->
    <!-- -------------------------------------------------- -->

    <header>

        <h1>
            INVESTIGATION SYSTEM <span>ver.1.2.0</span>
        </h1>

        <div class="status">

            <div class="user">

                <div class="title">LOGIN USER</div>

                <div class="name">
                    T.Y.
                    <span class="mode readOnly">[READ ONLY]</span>
                </div>

            </div>


            <a href="../login/">LOGOUT</a>

        </div>

    </header>

    <!-- -------------------------------------------------- -->
    <!-- メイン -->
    <!-- -------------------------------------------------- -->

    <main>

        <!-- ログイン後 -->
        <div id="mainWrapper">

            <!-- チュートリアルバー -->
            <div id="tutorialWrapper" class="hidden">
                <div class="tutorial">
                    <div class="title">TUTORIAL</div>
                    <p></p>
                </div>
            </div>

            <!-- メインコンテンツ -->
            <div id="mainContents">

                <!-- 【証拠】リスト -->
                <div class="pannel-left">

                    <div class="listTitle">
                        証拠
                        <span class="subTitle">EVIDENCE</span>
                    </div>

                    <div class="itemList">
                        <div class="groups"></div>
                    </div>

                </div>

                <!-- 詳細 -->
                <div class="pannel-middle">

                    <!-- 【証拠】詳細エリア -->
                    <div class="detail-evidence empty">
                        <div class="content">

                            <h2></h2>

                            <div class="text"></div>

                        </div>
                    </div>

                    <!-- 【推理】ボタンエリア -->
                    <div class="inference">
                        <button disabled>
                            推理<span class="subTitle">INFERENCE</span>
                        </button>
                    </div>

                    <!-- 【人物】詳細エリア -->
                    <div class="detail-person empty">
                        <div class="content">

                            <h2></h2>

                            <div class="text"></div>

                        </div>
                    </div>

                </div>

                <!-- 【人物】リスト -->
                <div class="pannel-right">

                    <div class="listTitle">
                        人物<span class="subTitle">PERSON</span>
                    </div>

                    <div class="itemList">
                        <div class="groups"></div>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- -------------------------------------------------- -->
    <!-- フッター -->
    <!-- -------------------------------------------------- -->

    <footer>
        <p>
            このサイトはフィクションです。
        </p>
    </footer>

    <!-- -------------------------------------------------- -->

</body>

</html>
