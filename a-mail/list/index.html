<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../../style/common.css" />
    <link rel="stylesheet" href="../base.css" />

    <script type="module" src="../../js/common.js"></script>
    <script type="module" src="../mail-common.js"></script>
    <script type="module" src="./controller.js"></script>

    <title>怪異調査報告／Amail</title>
</head>

<body id="mail">

    <!-- -------------------------------------------------- -->
    <!-- ヘッダー -->
    <!-- -------------------------------------------------- -->

    <header>

        <h1>REMAINS 13</h1>

        <div class="buttons">

            <a href="../../investigation-system/" target="_blank">推理</a>

            <span class="separator"></span>

            <a class="active">メール</a>

            <span class="separator"></span>

            <a>エンディング</a>

        </div>

    </header>

    <!-- -------------------------------------------------- -->
    <!-- メイン -->
    <!-- -------------------------------------------------- -->

    <main>

        <!-- サイドバー -->
        <div id="sideBar">

            <h1>Amail</h1>

            <ul class="buttons">

                <li id="button-receive">
                    受信ボックス
                    <span class="count"></span>
                </li>

                <li id="button-send">
                    送信ボックス
                </li>

                <li id="button-favorite">
                    お気に入り
                </li>

            </ul>

        </div>

        <!-- メール本文 -->
        <div id="mailContent">
            <div id="list">

                <div class="mailRow header">
                    <div class="star"></div>
                    <div class="user"></div>
                    <div class="title">件名</div>
                    <div class="date">受信日時</div>
                </div>

                <ul></ul>

            </div>
        </div>

    </main>

    <!-- -------------------------------------------------- -->
    <!-- フッター -->
    <!-- -------------------------------------------------- -->

    <footer>
        <p>
            このサイトはフィクションです。
        </p>
    </footer>

</body>

</html>
