<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="module" src="../../common/controler.js"></script>
    <script type="module" src="../controler.js"></script>
    <script type="module" src="./controler.js"></script>

    <link rel="stylesheet" href="../../common/style.css">
    <link rel="stylesheet" href="../style.css">

    <title>怪異調査報告／Amail</title>
</head>

<body id="mail">

    <!-- -------------------------------------------------- -->
    <!-- ヘッダー -->
    <!-- -------------------------------------------------- -->

    <header>

        <h1>REMAINS 13</h1>

        <div class="buttons">

            <a class="active">推理</a>

            <span class="separator"></span>

            <a href="../a-mail/list/" target="_blank">メール</a>

            <span class="separator"></span>

            <a href="" target="_blank">エンディング</a>

        </div>

    </header>

    <!-- -------------------------------------------------- -->
    <!-- メイン -->
    <!-- -------------------------------------------------- -->

    <main>

        <div id="area-main">

            <p>メール情報を取得しています……</p>

            <section class="is-hidden">

                <!-- サイドバー -->
                <div id="sideBar">

                    <h1>Amail</h1>

                    <ul class="buttons">

                        <li id="button-receive">
                            受信ボックス
                            <span class="count"></span>
                        </li>

                        <li id="button-send">
                            送信ボックス
                        </li>

                        <li id="button-favorite">
                            お気に入り
                        </li>

                    </ul>

                </div>

                <!-- メール本文 -->
                <div id="mailContent">
                    <div id="list">

                        <div class="mailRow header">
                            <div class="star"></div>
                            <div class="user"></div>
                            <div class="title">件名</div>
                            <div class="date">受信日時</div>
                        </div>

                        <ul></ul>

                    </div>
                </div>

            </section>

        </div>

        <!-- キーワードリスト -->
        <div id="collectListContainer"></div>

    </main>

    <!-- -------------------------------------------------- -->
    <!-- フッター -->
    <!-- -------------------------------------------------- -->

    <footer>
        <p>
            このサイトはフィクションです。
        </p>
    </footer>

</body>

</html>
